name: checks

# Enforce Script only compiles inside DayZ, so there is no build gate to run
# here. What this does instead is sweep for the failure classes that would
# otherwise be discovered by booting a server: a BOM that makes the parser
# report a nonexistent unclosed string, an unbalanced file left by a truncated
# write, a class declared twice in the same compile branch.
#
# The checker's own tests run first. A checker that reports zero failures
# proves nothing until it has been shown to fire.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-checks:
    runs-on: ubuntu-latest
    steps:
      # Full checkout: the tree carries ~450 MB of .p3d/.paa under data/.
      # Only .rvmat files there are read, so this can be narrowed with a
      # sparse checkout if run time becomes a problem.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test the checker (negative controls)
        run: python .github/tools/test_enforce_checks.py

      - name: Graph capacity refresh (offline source slice)
        run: python .github/tools/test_graph_capacity_refresh.py

      - name: Sweep the addon
        run: python .github/tools/enforce_checks.py --root .

      - name: Graph charger clock (offline source slice)
        run: python .github/tools/test_graph_charger_energy.py

      - name: FinishWiring quota admission (offline source slice)
        run: python .github/tools/test_finish_wiring_quota.py

      - name: Graph perf probe call sites (offline)
        run: python .github/tools/test_graph_perf_probe.py

      - name: Independent graph reference oracle
        run: python .github/tools/test_graph_reference.py

      - name: Graph multi-feed split (offline source slice)
        run: python .github/tools/test_graph_multifeed_split.py

      - name: CutWires reverse-index rebuild gate (offline source slice)
        run: python .github/tools/test_cutwires_rebuild_gate.py

      - name: Inspector source overload flag (offline source slice)
        run: python .github/tools/test_inspector_source_overload.py

      - name: Wire journal predicates (offline source slice)
        run: python .github/tools/test_wire_journal_rules.py

      - name: Wire journal scenarios (offline model + source slice)
        run: python .github/tools/test_wire_journal_scenarios.py

      - name: Wire journal structure pins (offline)
        run: python .github/tools/test_wire_journal_structure.py

      - name: Memory Cell Toggle rising-edge (offline source slice)
        run: python .github/tools/test_memorycell_toggle.py

      - name: Momentary pulse survives splitter blackout (offline)
        run: python .github/tools/test_pulse_survives_blackout.py

      - name: Laser occupied-vehicle box (offline source slice)
        run: python .github/tools/test_laser_vehicle_box.py

      - name: FinishWiring wire-replace notice (offline)
        run: python .github/tools/test_wire_replace_notice.py

      - name: Stringtable capacity and detector/cell copy
        run: python .github/tools/test_stringtable_capacity.py
